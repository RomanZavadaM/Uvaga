name: Windows NSIS test installer candidate

on:
  pull_request:
    paths:
      - 'app/**'
      - 'src-tauri/**'
      - 'scripts/verify_tauri_lock.py'
      - 'README*.md'
      - 'LICENSE.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'SECURITY.md'
      - 'docs/WINDOWS_DISTRIBUTION.md'
      - 'docs/WINDOWS_INSTALLER_R20.md'
      - '.github/workflows/windows-installer-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      VERIFIED_LOCK_SHA256: 6073fb5d12e3202ed3fdc2e9bf1cbb854b9a7efcfc45063ad5aeba48291b4b7d
      TAURI_CLI_VERSION: 2.12.2
      LICENSE_RUN_ID: '41426326573'
      LICENSE_ARTIFACT_NAME: Uvaga-r18-third-party-license-texts
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Restore and verify exact accepted application lock
        shell: pwsh
        run: |
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          cargo update --manifest-path src-tauri/Cargo.toml -p cc --precise 1.10.0
          python scripts/verify_tauri_lock.py

      - name: Test exact locked application graph
        shell: pwsh
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Install pinned Tauri CLI
        shell: pwsh
        run: |
          cargo install tauri-cli --version "$env:TAURI_CLI_VERSION" --locked
          cargo tauri --version

      - name: Fetch exact Windows third-party license texts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path ".release/licenses" | Out-Null
          gh run download "$env:LICENSE_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name "$env:LICENSE_ARTIFACT_NAME" --dir ".release/licenses"

          $licenseLock = ".release/licenses/Cargo.lock"
          if (!(Test-Path $licenseLock)) { throw "License evidence Cargo.lock missing" }
          $hash = (Get-FileHash $licenseLock -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:VERIFIED_LOCK_SHA256) { throw "License evidence lock mismatch: $hash" }

          $coverage = Get-Content ".release/licenses/WINDOWS_GRAPH_COVERAGE.json" -Raw | ConvertFrom-Json
          if ($coverage.windows_normal_build_external_count -ne 222) { throw "Expected 222 Windows external packages" }
          if ($coverage.cargo_about_external_count -ne 222) { throw "Expected 222 cargo-about packages" }
          if ($coverage.missing_from_cargo_about.Count -ne 0) { throw "Missing packages in license evidence" }
          if ($coverage.extra_in_cargo_about.Count -ne 0) { throw "Unexpected extra packages in license evidence" }
          if (!(Test-Path ".release/licenses/THIRD_PARTY_LICENSES.md")) { throw "Full third-party license text missing" }

      - name: Build unsigned NSIS candidate
        shell: pwsh
        env:
          CI: 'true'
        run: |
          cargo tauri build --bundles nsis
          python scripts/verify_tauri_lock.py

      - name: Assemble self-describing installer candidate
        shell: pwsh
        run: |
          $artifact = ".release/artifact"
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null

          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, got $($installers.Count)" }
          Copy-Item $installers[0].FullName "$artifact/Uvaga-r20-test-setup.exe"

          $appExe = "src-tauri/target/release/uvaga-app.exe"
          if (!(Test-Path $appExe)) { throw "Release executable missing: $appExe" }
          Copy-Item $appExe "$artifact/Uvaga.exe"

          Copy-Item "src-tauri/Cargo.lock" "$artifact/Cargo.lock"
          Copy-Item "README.md" "$artifact/README.md"
          Copy-Item "LICENSE.md" "$artifact/LICENSE.md"
          Copy-Item "THIRD_PARTY_NOTICES.md" "$artifact/THIRD_PARTY_NOTICES.md"
          Copy-Item ".release/licenses/THIRD_PARTY_LICENSES.md" "$artifact/THIRD_PARTY_LICENSES.md"
          Copy-Item ".release/licenses/WINDOWS_GRAPH_COVERAGE.json" "$artifact/WINDOWS_GRAPH_COVERAGE.json"

          @(
            "ТривогА / Uvaga — r20 Windows NSIS TEST installer candidate",
            "",
            "NOT A PRODUCTION RELEASE. UNSIGNED TEST ARTIFACT.",
            "Target: Windows 10/11 x64",
            "Install mode: currentUser",
            "Tauri CLI: $env:TAURI_CLI_VERSION",
            "Source PR head: $env:SOURCE_HEAD_SHA",
            "Exact application Cargo.lock SHA256: $env:VERIFIED_LOCK_SHA256",
            "Synthetic-only: no live source credentials, no updater, no public notifications, no geolocation.",
            "Owner manual install/uninstall/visual acceptance is still required.",
            "",
            "Full Windows third-party license texts are included in THIRD_PARTY_LICENSES.md."
          ) | Set-Content -Encoding utf8 "$artifact/INSTALLER_CANDIDATE.txt"

          @(
            "MPL 2.0 source-availability checkpoint for r20 TEST candidate",
            "",
            "Application dependency lock is identical to verified r18/r19 lock:",
            "$env:VERIFIED_LOCK_SHA256",
            "",
            "Reviewed MPL-covered source bundle is preserved in project backup evidence:",
            "Drive backup id: 1WRal8jzB9TPiwZUQczYlCf86MZbbQFdU",
            "GitHub PR #40 / compliance evidence recorded in VERIFICATION.md.",
            "",
            "This temporary test artifact is not the final public source-availability mechanism.",
            "Before production distribution, publish the exact corresponding MPL source material",
            "at a stable non-expiring location and reference it from the release package."
          ) | Set-Content -Encoding utf8 "$artifact/MPL_SOURCE_AVAILABILITY_TEST.txt"

          $files = @(
            "Uvaga-r20-test-setup.exe",
            "Uvaga.exe",
            "Cargo.lock",
            "README.md",
            "LICENSE.md",
            "THIRD_PARTY_NOTICES.md",
            "THIRD_PARTY_LICENSES.md",
            "WINDOWS_GRAPH_COVERAGE.json",
            "INSTALLER_CANDIDATE.txt",
            "MPL_SOURCE_AVAILABILITY_TEST.txt"
          )

          $sumLines = foreach ($name in $files) {
            if (!(Test-Path "$artifact/$name")) { throw "Artifact file missing: $name" }
            $hash = (Get-FileHash "$artifact/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          $sumLines | Set-Content -Encoding ascii "$artifact/SHA256SUMS.txt"

          $lockHash = (Get-FileHash "$artifact/Cargo.lock" -Algorithm SHA256).Hash.ToLower()
          if ($lockHash -ne $env:VERIFIED_LOCK_SHA256) { throw "Packaged lock drift: $lockHash" }

          Write-Host "Installer SHA256: $((Get-FileHash "$artifact/Uvaga-r20-test-setup.exe" -Algorithm SHA256).Hash.ToLower())"
          Write-Host "Executable SHA256: $((Get-FileHash "$artifact/Uvaga.exe" -Algorithm SHA256).Hash.ToLower())"

      - name: Upload Windows r20 installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: Uvaga-Windows-Installer-r20
          path: .release/artifact/*
          if-no-files-found: error
          retention-days: 30
