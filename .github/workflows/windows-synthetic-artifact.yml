name: Windows synthetic test artifact
on:
  pull_request:
    paths:
      - 'app/**'
      - 'src-tauri/**'
      - 'scripts/check_release_metadata.py'
      - 'scripts/verify_tauri_lock.py'
      - '.github/workflows/windows-synthetic-artifact.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: target/uvaga-test
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACCEPTED_LOCK_SHA256: '6073fb5d12e3202ed3fdc2e9bf1cbb854b9a7efcfc45063ad5aeba48291b4b7d'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release metadata
        run: python scripts/check_release_metadata.py
      - name: Restore verified dependency lock
        run: |
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          cargo update --manifest-path src-tauri/Cargo.toml -p cc --precise 1.10.0
          python scripts/verify_tauri_lock.py
      - name: Test offline Tauri bridge
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned debug executable
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - name: Prepare test artifact and checksums
        shell: pwsh
        run: |
          $artifact = "target/uvaga-test/artifact"
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null

          $exe = "target/uvaga-test/debug/uvaga-app.exe"
          if (!(Test-Path $exe)) { throw "Expected executable not found: $exe" }

          Copy-Item $exe "$artifact/Uvaga.exe"
          Copy-Item "src-tauri/Cargo.lock" "$artifact/Cargo.lock"
          Copy-Item "README.md" "$artifact/README.md"
          Copy-Item "LICENSE.md" "$artifact/LICENSE.md"
          Copy-Item "THIRD_PARTY_NOTICES.md" "$artifact/THIRD_PARTY_NOTICES.md"

          $files = @(
            "Uvaga.exe",
            "Cargo.lock",
            "README.md",
            "LICENSE.md",
            "THIRD_PARTY_NOTICES.md"
          )
          $sumLines = foreach ($name in $files) {
            $hash = (Get-FileHash "$artifact/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          $sumLines | Set-Content -Encoding ascii "$artifact/SHA256SUMS.txt"

          $exeHash = (Get-FileHash "$artifact/Uvaga.exe" -Algorithm SHA256).Hash.ToLower()
          $lockHash = (Get-FileHash "$artifact/Cargo.lock" -Algorithm SHA256).Hash.ToLower()
          if ($lockHash -ne $env:ACCEPTED_LOCK_SHA256) { throw "Packaged lock drift: $lockHash" }
          $appVersion = (python scripts/check_release_metadata.py --print-version).Trim()

          @(
            "ТривогА — Windows synthetic CI candidate",
            "",
            "НЕ РЕЛІЗ. НЕ PRODUCTION. НЕ СИСТЕМА РЕАЛЬНОГО ОПОВІЩЕННЯ.",
            "Artifact track: synthetic-candidate",
            "Target: Windows 10/11 x64",
            "Build: unsigned debug executable",
            "App version: $appVersion",
            "Source PR head: $env:SOURCE_HEAD_SHA",
            "GitHub Actions checkout SHA: $env:GITHUB_SHA",
            "GitHub Actions run: $env:GITHUB_RUN_ID",
            "Exact Cargo.lock SHA256: $env:ACCEPTED_LOCK_SHA256",
            "",
            "Мережа, live API, push і геолокація не підключені.",
            "Default scenario: UA-46 + active_stale => confirmed=active, freshness=stale, presentation=active_last_known.",
            "UI exposes whitelisted synthetic territory/scenario selection through local Tauri IPC.",
            "Якщо IPC не працює, UI має показати помилку, а не відбій.",
            "",
            "SHA256 див. SHA256SUMS.txt"
          ) | Set-Content -Encoding utf8 "$artifact/TEST_ARTIFACT.txt"

          $testInfoHash = (Get-FileHash "$artifact/TEST_ARTIFACT.txt" -Algorithm SHA256).Hash.ToLower()
          "$testInfoHash  TEST_ARTIFACT.txt" | Add-Content -Encoding ascii "$artifact/SHA256SUMS.txt"

          Write-Host "Uvaga executable SHA256: $exeHash"
          Write-Host "Cargo.lock SHA256: $lockHash"
      - name: Upload Windows synthetic artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uvaga-Windows-Synthetic-candidate-${{ github.run_number }}
          path: target/uvaga-test/artifact/*
          if-no-files-found: error
          retention-days: 30
