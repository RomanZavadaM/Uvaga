name: macOS Tauri product-platform checks
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'src/**'
      - 'app/**'
      - 'src-tauri/**'
      - 'scripts/verify_tauri_lock.py'
      - '.github/workflows/tauri-shell.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - macos-26-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore verified dependency lock
        run: |
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          cargo update --manifest-path src-tauri/Cargo.toml -p cc --precise 1.10.0
          python scripts/verify_tauri_lock.py
      - name: Check Tauri shell on macOS
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
