name: Tauri shell product-platform checks
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'app/**'
      - 'src-tauri/**'
      - '.github/workflows/tauri-shell.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - macos-26
          - macos-26-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore verified dependency lock
        run: |
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          cargo update --manifest-path src-tauri/Cargo.toml -p cc --precise 1.10.0
          python scripts/verify_tauri_lock.py
      - name: Test Tauri shell bridge on Windows
        if: matrix.os == 'windows-2025'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Check Tauri shell on macOS
        if: matrix.os != 'windows-2025'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Export generated Cargo.lock for repository checkpoint
        if: matrix.os == 'windows-2025'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
