name: UI contract checks
on:
  pull_request:
    paths:
      - 'app/**'
      - 'src-tauri/src/main.rs'
      - 'README*.md'
      - 'scripts/check_ui_contract.py'
      - '.github/workflows/ui-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate static UI safety contract
        run: python scripts/check_ui_contract.py
