name: Third-party full license texts

on:
  pull_request:
    paths:
      - 'about.toml'
      - 'about.hbs'
      - '.github/workflows/third-party-license-texts.yml'
      - 'docs/THIRD_PARTY_LICENSE_TEXTS.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      R18_RUN_ID: '41415006414'
      R18_ARTIFACT_NAME: 'Uvaga-Windows-Synthetic-r18'
      R18_LOCK_SHA256: '6073fb5d12e3202ed3fdc2e9bf1cbb854b9a7efcfc45063ad5aeba48291b4b7d'
      CARGO_ABOUT_VERSION: '0.9.2'
      CARGO_ABOUT_SHA256: '9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Download and verify exact r18 Cargo.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .audit/r18 .audit/bin .audit/out
          gh run download "$R18_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$R18_ARTIFACT_NAME" \
            --dir .audit/r18
          echo "$R18_LOCK_SHA256  .audit/r18/Cargo.lock" | sha256sum --check --strict
          cp .audit/r18/Cargo.lock src-tauri/Cargo.lock

      - name: Install pinned cargo-about binary
        run: |
          url="https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --silent --show-error "$url" -o .audit/cargo-about.tar.gz
          echo "$CARGO_ABOUT_SHA256  .audit/cargo-about.tar.gz" | sha256sum --check --strict
          tar -xzf .audit/cargo-about.tar.gz -C .audit/bin --strip-components=1
          .audit/bin/cargo-about --version

      - name: Fetch exact locked dependency sources
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Derive independent Windows normal-build closure
        run: |
          cargo metadata \
            --locked \
            --filter-platform x86_64-pc-windows-msvc \
            --format-version 1 \
            --manifest-path src-tauri/Cargo.toml \
            > .audit/out/windows-metadata.json

      - name: Generate machine-readable full license data
        run: |
          .audit/bin/cargo-about generate \
            --locked \
            --offline \
            --fail \
            --manifest-path src-tauri/Cargo.toml \
            --config about.toml \
            --format json \
            > .audit/out/THIRD_PARTY_LICENSES.json

      - name: Generate human-readable full license texts
        run: |
          .audit/bin/cargo-about generate \
            --locked \
            --offline \
            --fail \
            --manifest-path src-tauri/Cargo.toml \
            --config about.toml \
            --output-file .audit/out/THIRD_PARTY_LICENSES.md \
            about.hbs

      - name: Validate generated output and Windows graph coverage
        run: |
          test -s .audit/out/THIRD_PARTY_LICENSES.json
          test -s .audit/out/THIRD_PARTY_LICENSES.md
          grep -q 'third-party license texts' .audit/out/THIRD_PARTY_LICENSES.md
          grep -q 'MPL-2.0' .audit/out/THIRD_PARTY_LICENSES.md
          python3 - <<'PY'
          import json
          from collections import deque
          from pathlib import Path

          out = Path('.audit/out')
          meta = json.loads((out / 'windows-metadata.json').read_text(encoding='utf-8'))
          about = json.loads((out / 'THIRD_PARTY_LICENSES.json').read_text(encoding='utf-8'))

          packages = {p['id']: p for p in meta['packages']}
          nodes = {n['id']: n for n in meta['resolve']['nodes']}
          root = meta['resolve']['root']
          if not root:
              raise SystemExit('Windows metadata has no resolve.root')

          seen = {root}
          queue = deque([root])
          while queue:
              current = queue.popleft()
              for dep in nodes[current].get('deps', []):
                  kinds = dep.get('dep_kinds', [])
                  if kinds and all(k.get('kind') == 'dev' for k in kinds):
                      continue
                  target = dep['pkg']
                  if target not in seen:
                      seen.add(target)
                      queue.append(target)

          expected = {
              (packages[p]['name'], packages[p]['version'])
              for p in seen
              if (packages[p].get('source') or '').startswith('registry+')
          }
          actual = {
              (entry['package']['name'], entry['package']['version'])
              for entry in about['crates']
              if (entry['package'].get('source') or '').startswith('registry+')
          }

          missing = sorted(expected - actual)
          extra = sorted(actual - expected)
          summary = {
              'windows_normal_build_external_count': len(expected),
              'cargo_about_external_count': len(actual),
              'missing_from_cargo_about': missing,
              'extra_in_cargo_about': extra,
          }
          (out / 'WINDOWS_GRAPH_COVERAGE.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if missing or extra:
              raise SystemExit('cargo-about output does not exactly match Windows normal+build dependency closure')
          PY
          cp src-tauri/Cargo.lock .audit/out/Cargo.lock
          cp about.toml .audit/out/about.toml
          cp about.hbs .audit/out/about.hbs
          {
            echo "source_run=$R18_RUN_ID"
            echo "source_artifact=$R18_ARTIFACT_NAME"
            echo "cargo_lock_sha256=$R18_LOCK_SHA256"
            echo "cargo_about_version=$CARGO_ABOUT_VERSION"
            echo "cargo_about_archive_sha256=$CARGO_ABOUT_SHA256"
            echo "target=x86_64-pc-windows-msvc"
            echo "dependency_scope=normal+build; dev excluded"
            echo "purpose=exact-r18 Windows third-party full license text generation"
          } > .audit/out/EVIDENCE.txt

      - name: Upload full third-party license texts
        uses: actions/upload-artifact@v4
        with:
          name: Uvaga-r18-third-party-license-texts
          path: .audit/out/*
          if-no-files-found: error
          retention-days: 30
