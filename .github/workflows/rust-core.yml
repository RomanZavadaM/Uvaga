name: Rust core offline tests
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - '.github/workflows/rust-core.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run offline core tests when a Rust core exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Cargo.toml ]]; then
            cargo test --offline --all-targets
          else
            echo "Docs-only base: Cargo.toml not present yet; no Rust core to test."
          fi
